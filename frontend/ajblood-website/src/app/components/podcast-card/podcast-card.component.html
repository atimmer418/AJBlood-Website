<div class="podcast-card">
  <div class="card-thumb">
    <span class="material-symbols-outlined play-icon" aria-hidden="true">play_circle</span>
  </div>
  <div class="card-body">
    <p class="episode-label">Season 1, Episode {{ episode }}</p>
    <h4 class="episode-title">{{ title }}</h4>
    <p class="episode-desc">{{ desc }}</p>
    <p class="episode-guests">with {{ guests }}</p>
  </div>
</div>
