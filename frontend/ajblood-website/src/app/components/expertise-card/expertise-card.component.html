<div class="expertise-card" [class.dark]="dark" [class.has-image]="image">
  @if (image) {
    <img [src]="image" alt="" role="presentation" class="bg-image" />
  }
  <div class="card-content">
    <span class="material-symbols-outlined card-icon" aria-hidden="true">{{ icon }}</span>
    <h3 class="card-title">{{ title }}</h3>
    <p class="card-desc">{{ desc }}</p>
    @if (tags.length) {
      <div class="card-tags">
        @for (tag of tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>
    }
  </div>
</div>
